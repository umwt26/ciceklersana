<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sana Bir Buket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender, quiet, a night letter
   IDEA: a bouquet handed over in the dark, with a little paper tag
   PICTURE: canvas-painted bouquet (tulips, lilies, daisies, baby's breath, eucalyptus)
   COLOUR and TYPE: deep plum night, rose accent, cream paper; Dancing Script + Nunito
   LAYOUT: one phone-height stage, controls at the thumb, safe areas respected */
:root{color-scheme:dark;--ink:#fbeef3;--rose:#ff6f91;--soft:#f7c6d4;--paper:#fffaf5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#14070f;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bg{position:fixed;inset:0;background:radial-gradient(90% 60% at 50% 30%,#5e2346 0%,#2d1226 48%,#13060e 100%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 25% at 18% 12%,rgba(255,150,190,.10),transparent 70%),radial-gradient(35% 22% at 85% 70%,rgba(255,120,160,.08),transparent 70%)}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:opacity .9s ease}
.hide{opacity:0;pointer-events:none}

#intro{align-items:center;justify-content:center;text-align:center;cursor:pointer;z-index:5}
#msg{font:700 clamp(30px,8.4vw,48px)/1.32 'Dancing Script',cursive;max-width:560px;padding:0 30px;min-height:6.5em;display:flex;align-items:center;justify-content:center;text-shadow:0 0 28px rgba(255,111,145,.35)}
.cur{display:inline-block;width:2px;height:.85em;background:var(--soft);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
#tapHint{margin-top:22px;font-size:15px;color:var(--soft);opacity:0;transition:opacity .8s}
#tapHint.on{opacity:1}
#tapHint.on span{animation:breath 2.2s ease-in-out infinite}
.ring{width:52px;height:52px;border-radius:50%;border:2px solid var(--soft);margin:0 auto 12px;position:relative}
.ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--soft);animation:ping 1.8s ease-out infinite}
@keyframes blink{50%{opacity:0}}
@keyframes breath{50%{opacity:.4}}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}

#top{text-align:center;padding:10px 16px 0;transition:opacity .6s}
#top h1{font:700 30px/1.1 'Dancing Script',cursive;color:#fff}
#top p{font-size:13px;color:var(--soft);margin-top:3px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;height:12%;background:#000;transform:scaleY(0);transition:transform .9s ease;pointer-events:none;z-index:2}
.bar.t{top:0;transform-origin:top}.bar.b{bottom:0;transform-origin:bottom}
.cine .bar{transform:scaleY(1)}
.cine #ctrl,.cine #top{opacity:.12;pointer-events:none}
#ctrl{display:flex;gap:10px;justify-content:center;align-items:center;padding:10px 14px 14px;transition:opacity .6s}
button{font:700 15px Nunito,sans-serif;color:#fff;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);min-height:48px;border-radius:24px;padding:0 18px;cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.93);background:rgba(255,255,255,.18)}
button:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
.round{width:48px;padding:0;font-size:24px;line-height:1}
.main-b{background:linear-gradient(135deg,#ff6f91,#c9184a);border-color:transparent;box-shadow:0 6px 18px rgba(201,24,74,.4)}
#say{position:absolute;left:50%;top:14%;width:max-content;max-width:88%;background:rgba(30,8,20,.72);border-radius:22px;padding:8px 22px;translate:-50% 0;text-align:center;font:700 34px/1.2 'Dancing Script',cursive;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.7);opacity:0;transition:opacity .7s;z-index:3;pointer-events:none}
#say.on{opacity:1}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

#note{z-index:8;align-items:center;justify-content:center;background:rgba(12,3,9,.82)}
.card{position:relative;width:min(92vw,440px);max-height:calc(100% - 24px);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);color:#4a1530;border-radius:22px;padding:30px 24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.55);transform:scale(.85) translateY(30px);opacity:0;transition:transform .7s cubic-bezier(.2,1.2,.4,1),opacity .5s}
#note:not(.hide) .card{transform:none;opacity:1}
.card::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(201,24,74,.3);border-radius:16px;pointer-events:none}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;color:#4a1530;background:rgba(201,24,74,.08);border:0;font-size:20px;z-index:2}
.intro-l{font:600 16px Nunito,sans-serif;color:#9a4a6a;margin-bottom:10px;padding-right:40px}
.poem{font:700 clamp(23px,6.4vw,28px)/1.45 'Dancing Script',cursive}
.ln{display:block;opacity:0;transform:translateY(8px);transition:opacity .7s,transform .7s}
.show .ln{opacity:1;transform:none}
.eyes{margin:20px -6px 16px;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(201,24,74,.28),0 0 0 4px #fff,0 0 0 5px rgba(201,24,74,.2);opacity:0;transform:scale(.94);transition:opacity 1s,transform 1s}
.show .eyes{opacity:1;transform:none}
.eyes img{display:block;width:100%;height:auto}
.sig{font:700 24px 'Dancing Script',cursive;text-align:right;color:#c9184a}
</style>
</head>
<body>
<div class="bg"></div>

<section id="intro" class="scr">
  <div id="msg"><span><span id="typed"></span><span class="cur"></span></span></div>
  <div id="tapHint"><div class="ring"></div><span>Devam etmek için ekrana dokun 🤍</span></div>
</section>

<section id="main" class="scr hide">
  <header id="top">
    <h1>Senin için 🤍</h1>
    <p>Çiçeklere dokun, kaydır · Nota tıkla 💌</p>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="bar t"></div><div class="bar b"></div>
    <div id="say"></div>
  </div>
  <nav id="ctrl">
    <button class="round" id="zo" aria-label="Uzaklaş">−</button>
    <button id="cine">🎬 İzle</button>
    <button id="smell" class="main-b">🌸 Kokla</button>
    <button class="round" id="zi" aria-label="Yakınlaş">+</button>
  </nav>
</section>

<section id="note" class="scr hide" role="dialog" aria-label="Not">
  <div class="card" id="card">
    <button class="x" id="close" aria-label="Kapat">✕</button>
    <div class="intro-l ln">Bir metinde okumuştum,</div>
    <div class="poem">
      <span class="ln">Kalpler uzak da olsa, hikaye nettir</span>
      <span class="ln">Gönül dediğin nedir, kalp isteyince</span>
      <span class="ln">Tüm dertlerin dermanı, bir çift gözdedir.</span>
    </div>
    <div class="eyes"><img src="eyes.jpg" alt="Sevgilimin gözleri"></div>
    <div class="sig ln">~ Seni çok seven sevgilin, Umut 🤍</div>
  </div>
</section>

<canvas id="fx"></canvas>

<script>

  <rect x="-47" y="-1" width="94" height="60" rx="5" fill="none" stroke="#f2b8c9" stroke-width=".8" stroke-dasharray="3 2.5"/>
  <circle cx="0" cy="2" r="3" fill="#2a0d1c" opacity=".35"/><circle cx="0" cy="2" r="3.6" fill="none" stroke="#d6a0b4" stroke-width="1.2"/>
  <path d="M-36,50 c-2,-3 -6,-1 -4,2 l4,4 l4,-4 c2,-3 -2,-5 -4,-2z" fill="#ff6f91"/><path d="M36,50 c-2,-3 -6,-1 -4,2 l4,4 l4,-4 c2,-3 -2,-5 -4,-2z" fill="#ff6f91"/>`;

const TUL={red:['#ff8191','#e5233f','#930a26'],pink:['#ffd3e3','#ff7fae','#bd2c66'],coral:['#ffc8a8','#ff6b6b','#b23244'],blush:['#fff2f6','#ffb6cd','#cf5f87']};
const SP={};
const ready=(async()=>{
  const H=7,P=4;
  const jobs={lily:[lilySvg(),[-60,-60,120,120],H],daisy:[daisySvg(),[-28,-28,56,56],H],euc:[eucSvg(),[-14,-96,28,100],H],gyp:[gypSvg(),[-36,-48,72,62],H],leaf:[leafSvg(),[-10,-62,20,64],H],
    back:[backSvg(),[0,170,400,345],P],front:[frontSvg(),[55,305,290,215],P],ribbon:[ribbonSvg(),[140,405,120,108],H],tag:[tagSvg(),[-58,-12,116,82],H]};
  for(const k in TUL)jobs['t_'+k]=[tulipSvg(TUL[k]),[-24,-50,48,64],H];
  const keys=Object.keys(jobs),res=await Promise.all(keys.map(k=>sprite(...jobs[k])));
  keys.forEach((k,i)=>SP[k]=res[i]);
  try{await Promise.race([Promise.all([document.fonts.load('700 20px "Dancing Script"'),document.fonts.load('700 12px Nunito')]),new Promise(r=>setTimeout(r,1500))])}catch(e){}
})().catch(()=>{});
const readyT=Promise.race([ready,new Promise(r=>setTimeout(r,5000))]);
const ds=sp=>{if(sp&&sp.c.width)ctx.drawImage(sp.c,sp.vb[0],sp.vb[1],sp.vb[2],sp.vb[3])};

/* ================= scene data ================= */
const FL=[
 ['l',150,112,1.12,-20],['l',256,104,1.12,18],['l',203,62,1.02,4],['l',74,178,.94,-34],['l',330,174,.94,32],
 ['t',200,150,1.1,'red'],['t',128,154,1,'blush'],['t',276,152,1,'coral'],['t',162,212,1.05,'pink'],['t',242,216,1.05,'red'],['t',115,234,1.1,'coral'],['t',290,236,1.1,'pink'],
 ['d',200,192,.75],['d',94,206,.8],['d',306,202,.8],['d',200,252,.85],['d',70,262,.95],['d',332,258,.95],['d',126,304,.9],['d',276,304,.9]
].map(([ty,x,y,s,v],i)=>({ty,x,y,s,i,
  sp:ty==='t'?'t_'+v:ty==='l'?'lily':'daisy',
  r:ty==='l'?v*Math.PI/180:ty==='t'?(x-200)*.0024:(x-200)*.001,
  hr:ty==='l'?44:ty==='t'?24:22,
  col:ty==='t'?TUL[v][1]:ty==='l'?'#ffb3c9':'#ffffff',
  ph:Math.random()*6.28,sp2:.8+Math.random()*.5,a:0,v:0,p:0,ang:0,bl:0}));
const HEADS=[...FL].sort((a,b)=>a.y-b.y);
const EU=[[52,252,-.95],[348,252,.95],[98,292,-.6],[302,292,.6],[150,250,-.3],[250,250,.3]].map(([x,y,r])=>({x,y,r,ph:Math.random()*6,a:0}));
const GY=[[58,218,-.5],[342,218,.5],[168,272,-.15],[234,274,.15],[204,118,0],[110,190,-.3],[292,186,.3]].map(([x,y,r])=>({x,y,r,ph:Math.random()*6}));

/* ================= camera ================= */
let cw=0,ch=0;
const cam={cx:200,cy:266,z:1},tgt={cx:200,cy:266,z:1};
let path=null,pathT0=0,pathDone=null,wind=1,windT=1,tagA=0,tagV=0;
const K=()=>Math.max(.01,Math.min(cw/400,ch/560));
function clampCam(o){const k=K(),hw=cw/(2*k*o.z),hh=ch/(2*k*o.z);
  o.cx=hw*2>=400?200:clamp(o.cx,hw,400-hw);o.cy=hh*2>=560?266:clamp(o.cy,hh,560-hh)}
function resize(){
  cw=stage.clientWidth;ch=stage.clientHeight;cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
  fxc.width=Math.round(innerWidth*DPR);fxc.height=Math.round(innerHeight*DPR);clampCam(tgt);
}
new ResizeObserver(resize).observe(stage);addEventListener('resize',resize);resize();
function runPath(frames,done){
  frames.unshift({t:0,cx:cam.cx,cy:cam.cy,z:cam.z});path=frames;pathT0=performance.now();pathDone=done;
}
const busy=()=>!!path;

/* ================= particles ================= */
const PC=['#ff6f91','#ffc2d4','#ffffff','#ff4d6d','#ff9eb5','#ffe3ec'];
const parts=[];
function add(o){if(parts.length<160)parts.push(Object.assign({r:Math.random()*6.28,vr:(Math.random()-.5)*.12,life:0,fl:0,g:0,dr:1,grow:1,ph:Math.random()*6},o))}
function burst(x,y,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=2+Math.random()*4.5;add({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,g:.13,dr:.965,s:4+Math.random()*4,c:Math.random()<.6?c:PC[i%6],max:55+Math.random()*35})}}
function drop(){add({x:Math.random()*innerWidth,y:-14,vx:(Math.random()-.5)*.6,vy:.7+Math.random()*.7,fl:.7,s:3.5+Math.random()*3.5,c:PC[Math.random()*6|0],max:(innerHeight+30)/.8})}
function flyIn(n){const cx=innerWidth/2,cy=innerHeight*.42;for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=1+Math.random()*3;add({x:cx+(Math.random()-.5)*80,y:cy+(Math.random()-.5)*60,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dr:.99,grow:1.035,s:3+Math.random()*3,c:PC[i%6],max:70+Math.random()*30})}}
function stepFx(dt){
  fx.setTransform(DPR,0,0,DPR,0,0);fx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.life+=dt;if(p.life>p.max){parts.splice(i,1);continue}
    const d=Math.pow(p.dr,dt);p.vx*=d;p.vy=p.vy*d+p.g*dt;
    p.x+=(p.vx+Math.sin(p.life*.05+p.ph)*p.fl)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.s*=Math.pow(p.grow,dt);
    const al=1-Math.pow(p.life/p.max,3);const c=Math.cos(p.r),s=Math.sin(p.r);
    fx.setTransform(c*DPR,s*DPR,-s*DPR,c*DPR,p.x*DPR,p.y*DPR);fx.globalAlpha=al;
    fx.fillStyle=p.c;fx.beginPath();fx.ellipse(0,0,p.s,p.s*.55,0,0,6.283);fx.fill();
    fx.fillStyle='rgba(255,255,255,.35)';fx.beginPath();fx.ellipse(-p.s*.25,-p.s*.1,p.s*.4,p.s*.18,0,0,6.283);fx.fill();
  }
  fx.globalAlpha=1;
}

/* ================= draw ================= */
let mainOn=false,noteOpen=false,t0=0,dropAcc=0;
function rotB(a){ctx.translate(B.x,B.y);ctx.rotate(a);ctx.translate(-B.x,-B.y)}
function update(dt,now){
  if(path){const t=now-pathT0,end=path[path.length-1].t;
    let j=1;while(j<path.length-1&&path[j].t<t)j++;
    const a=path[j-1],b=path[j],u=ss(clamp((t-a.t)/(b.t-a.t),0,1));
    cam.cx=a.cx+(b.cx-a.cx)*u;cam.cy=a.cy+(b.cy-a.cy)*u;cam.z=a.z+(b.z-a.z)*u;
    if(t>=end){path=null;tgt.cx=cam.cx;tgt.cy=cam.cy;tgt.z=cam.z;pathDone&&pathDone()}
  }else{const f=1-Math.pow(.84,dt);cam.cx+=(tgt.cx-cam.cx)*f;cam.cy+=(tgt.cy-cam.cy)*f;cam.z+=(tgt.z-cam.z)*f}
  wind+=(windT-wind)*(1-Math.pow(.95,dt));
  const st=1-Math.pow(.9,dt);
  for(const f of FL){
    const w=(Math.sin(now*.0011*f.sp2+f.ph)*.02+Math.sin(now*.0029+f.ph*1.7)*.007)*wind;
    f.v+=-f.a*.05*dt;f.v*=Math.pow(.91,dt);f.a+=f.v*dt;f.ang=w+f.a;f.p*=Math.pow(.88,dt);
    f.bl=easeBack((now-t0-450-f.i*70)/750);
  }
  tagV+=-tagA*.04*dt;tagV*=Math.pow(.93,dt);tagA+=tagV*dt;
}
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,cw,ch);
  const k=K(),s=k*cam.z,e=clamp((now-t0)/900,0,1),eo=1-Math.pow(1-e,3);
  ctx.translate(cw/2,ch/2);ctx.scale(s,s);ctx.translate(-cam.cx,-cam.cy);
  ctx.globalAlpha=e;ctx.translate(0,(1-eo)*40);ctx.translate(B.x,B.y);ctx.scale(.88+.12*eo,.88+.12*eo);ctx.translate(-B.x,-B.y);
  const g=ctx.createRadialGradient(200,250,10,200,250,250);g.addColorStop(0,'rgba(255,140,180,.26)');g.addColorStop(1,'rgba(255,140,180,0)');
  ctx.fillStyle=g;ctx.fillRect(-60,0,520,520);
  const sh=ctx.createRadialGradient(200,520,2,200,520,90);sh.addColorStop(0,'rgba(0,0,0,.45)');sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();ctx.translate(200,520);ctx.scale(1,.18);ctx.translate(-200,-520);ctx.fillStyle=sh;ctx.fillRect(100,420,200,200);ctx.restore();
  ds(SP.back);
  const gw=Math.sin(now*.0012)*.012*wind;
  for(const u of EU){ctx.save();rotB(gw+Math.sin(now*.0013+u.ph)*.01*wind);ctx.translate(u.x,u.y);ctx.rotate(u.r);ds(SP.euc);ctx.restore()}
  // stems
  for(const f of FL){
    if(f.bl<=0)continue;
    const bx=B.x+(f.x-B.x)*.08,qx=B.x+(f.x-B.x)*.3,qy=(f.y+B.y)/2+18;
    ctx.save();rotB(f.ang);
    ctx.beginPath();ctx.moveTo(bx,B.y);ctx.quadraticCurveTo(qx,qy,f.x,f.y+4);
    ctx.lineCap='round';ctx.strokeStyle='#3b7636';ctx.lineWidth=f.ty==='d'?2.4:3.4;ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-.8,B.y);ctx.quadraticCurveTo(qx-.8,qy,f.x-.8,f.y+4);ctx.strokeStyle='rgba(140,200,120,.45)';ctx.lineWidth=.8;ctx.stroke();
    if(f.ty==='t'){ctx.translate((f.x+qx)/2,(f.y+qy)/2+12);ctx.rotate((f.x<200?-1:1)*.5);ds(SP.leaf)}
    ctx.restore();
  }
  for(const u of GY){ctx.save();rotB(gw+Math.sin(now*.0016+u.ph)*.015*wind);ctx.translate(u.x,u.y);ctx.rotate(u.r);ds(SP.gyp);ctx.restore()}
  // heads
  for(const f of HEADS){
    if(f.bl<=0)continue;
    ctx.save();rotB(f.ang);ctx.translate(f.x,f.y);ctx.rotate(f.r+f.ang*.6);const sc=f.s*f.bl*(1+f.p);ctx.scale(sc,sc);ds(SP[f.sp]);ctx.restore();
  }
  ds(SP.front);
  // twine + tag
  const ta=.13+Math.sin(now*.0017)*.06+tagA;
  ctx.beginPath();ctx.moveTo(206,446);ctx.quadraticCurveTo(255,452,298,418);ctx.strokeStyle='#e9c78f';ctx.lineWidth=1.3;ctx.stroke();
  ds(SP.ribbon);
  ctx.save();ctx.translate(298,418);ctx.rotate(ta);ds(SP.tag);
  ctx.textAlign='center';ctx.fillStyle='#a4133c';ctx.font='700 15.5px "Dancing Script", cursive';ctx.fillText('Sana bir notum var',0,28,92);
  ctx.globalAlpha=e*(.55+.45*Math.sin(now*.005));ctx.font='700 9px Nunito, sans-serif';ctx.fillStyle='#c9184a';ctx.fillText('💌 dokun ve aç',0,46,80);
  ctx.restore();
  ctx.globalAlpha=1;
}
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last)/16.667;last=now;
  dropAcc+=dt;if(dropAcc>48&&!document.hidden){dropAcc=0;drop()}
  try{if(mainOn){update(dt,now);if(!noteOpen)draw(now)}stepFx(dt)}catch(err){}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= intro ================= */
const chars=Array.from(TEXT);let ti=0,typing=true,timer,going=false;
function type(){
  if(ti>=chars.length){typing=false;$('#tapHint').classList.add('on');return}
  const c=chars[ti++];$('#typed').textContent+=c;timer=setTimeout(type,c==='.'?260:c===' '?70:48);
}
setTimeout(type,700);
intro.addEventListener('click',async()=>{
  audio();
  if(typing){clearTimeout(timer);$('#typed').textContent=TEXT;typing=false;$('#tapHint').classList.add('on');return}
  if(going)return;going=true;try{await readyT}catch(e){}try{chime()}catch(e){}
  intro.classList.add('hide');main.classList.remove('hide');resize();t0=performance.now();mainOn=true;
  setTimeout(()=>flyIn(16),600);
});

/* ================= controls ================= */
function zoom(f){if(busy())return;tgt.z=clamp(tgt.z*f,1,3);if(tgt.z<1.02){tgt.z=1}clampCam(tgt)}
$('#zi').onclick=()=>zoom(1.45);$('#zo').onclick=()=>zoom(1/1.45);
$('#cine').onclick=()=>{
  if(busy())return;audio();main.classList.add('cine');windT=1.6;
  runPath([{t:2400,cx:322,cy:196,z:2.4},{t:3400,cx:318,cy:190,z:2.4},{t:7800,cx:84,cy:200,z:2.4},{t:10200,cx:203,cy:78,z:2.7},{t:11400,cx:205,cy:84,z:2.7},{t:13600,cx:298,cy:448,z:2.3},{t:16000,cx:200,cy:266,z:1}],
    ()=>{main.classList.remove('cine');windT=1;tgt.cx=200;tgt.cy=266;tgt.z=1});
};
$('#smell').onclick=()=>{
  if(busy())return;sniffSound();windT=3.2;
  runPath([{t:1200,cx:200,cy:158,z:2.9},{t:3000,cx:202,cy:150,z:3},{t:4400,cx:200,cy:266,z:1}],()=>{windT=1});
  setTimeout(()=>{say.textContent='Mmmh… kokusu tıpkı senin gibi 🌷';say.classList.add('on')},900);
  setTimeout(()=>say.classList.remove('on'),3400);
  setTimeout(()=>flyIn(26),1300);
  FL.forEach(f=>f.v+=(Math.random()-.5)*.05);
};

/* ================= touch ================= */
const pts=new Map();let gest=null;
const toUnit=(px,py)=>{const r=cv.getBoundingClientRect(),k=K()*cam.z;return[(px-r.left-cw/2)/k+cam.cx,(py-r.top-ch/2)/k+cam.cy]};
const rotPt=(x,y,a)=>{const c=Math.cos(a),s=Math.sin(a),dx=x-B.x,dy=y-B.y;return[B.x+dx*c-dy*s,B.y+dx*s+dy*c]};
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)gest={t:'tap',sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false};
  else if(pts.size===2&&!busy()){const[a,b]=[...pts.values()];gest={t:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:tgt.z}}
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!gest)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest.t==='pinch'){if(pts.size<2)return;const[a,b]=[...pts.values()];tgt.z=clamp(gest.z*Math.hypot(a.x-b.x,a.y-b.y)/gest.d,1,3);clampCam(tgt);return}
  const dx=e.clientX-gest.lx,dy=e.clientY-gest.ly;gest.lx=e.clientX;gest.ly=e.clientY;
  if(Math.abs(e.clientX-gest.sx)+Math.abs(e.clientY-gest.sy)>8)gest.moved=true;
  if(!gest.moved)return;
  if(tgt.z>1.02&&!busy()){const k=K()*cam.z;tgt.cx-=dx/k;tgt.cy-=dy/k;clampCam(tgt);cam.cx=tgt.cx;cam.cy=tgt.cy}
  else{for(const f of FL)f.v=clamp(f.v+dx*.00055*(.7+((f.i*37)%10)/20),-.07,.07);tagV+=dx*.0006}
});
function endPtr(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(gest&&gest.t==='tap'&&!gest.moved&&e.type==='pointerup')tap(e.clientX,e.clientY);
  if(pts.size===0)gest=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
function tap(px,py){
  audio();const[ux,uy]=toUnit(px,py);
  const ta=.13+Math.sin(performance.now()*.0017)*.06+tagA,c=Math.cos(-ta),s=Math.sin(-ta),lx=(ux-298)*c-(uy-418)*s,ly=(ux-298)*s+(uy-418)*c;
  if(lx>-58&&lx<58&&ly>-12&&ly<70){tagV+=.08;openNote();return}
  for(let i=HEADS.length-1;i>=0;i--){const f=HEADS[i];const[hx,hy]=rotPt(f.x,f.y,f.ang);
    if(Math.hypot(ux-hx,uy-hy)<f.hr*f.s){f.v+=(ux<hx?1:-1)*.085;f.p=.22;burst(px,py,f.col,16);tink(f.i);return}}
  burst(px,py,'#ffc2d4',7);FL.forEach(f=>f.v+=(ux<200?1:-1)*.012);
}

/* ================= note ================= */
function openNote(){
  chime();noteOpen=true;note.classList.remove('hide');const card=$('#card');card.scrollTop=0;
  const ls=[...card.querySelectorAll('.ln')];ls.forEach((l,i)=>l.style.transitionDelay=(.35+i*.55)+'s');
  card.querySelector('.eyes').style.transitionDelay=(.35+4*.55)+'s';ls[ls.length-1].style.transitionDelay=(.35+5*.55)+'s';
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('show')));
  setTimeout(()=>{for(let i=0;i<18;i++)burst(innerWidth/2+(Math.random()-.5)*200,innerHeight*.3,PC[i%6],1)},300);
}
function closeNote(){note.classList.add('hide');$('#card').classList.remove('show');noteOpen=false}
$('#close').onclick=closeNote;
note.addEventListener('click',e=>{if(e.target===note)closeNote()});
document.addEventListener('gesturestart',e=>e.preventDefault());
}
</script>
</body>
